name: Arduino Library Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Arduino Lint
        uses: arduino/arduino-lint-action@v3
        with:
          compliance: specification
          library-manager: false
          project-type: all